name: C.64 agent synthetic VictoriaMetrics adapter — offline only

on:
  pull_request:
    paths:
      - 'experiments/fedora/local-ai-agent-v0.21/c64/**'
      - '.github/workflows/agent-c64-offline.yml'
      - 'experiments/fedora/local-ai-agent-v0.21/c63/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c64-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Check pinned C.63 upstream source integrity
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/fedora/local-ai-agent-v0.21/c63
          sha256sum --check SHA256SUMS
          sha256sum --check SHA256SUMS_PUBLIC_C63_11_14.txt
          test "$(find . -maxdepth 1 -type f -name 'local_ai_agent_v021c63*.py' | wc -l)" -eq 17
      - name: Test the C.64 offline synthetic parser adapter
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=experiments/fedora/local-ai-agent-v0.21/c64/local_ai_agent_v021c64_0_synthetic_vm_envelope_adapter.py
          python3 -B "$SCRIPT" --self-test
          python3 -B "$SCRIPT" --fixture-matrix
          python3 -B "$SCRIPT" --summary-json --scenario baseline | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["mode"] == "SYNTHETIC_OFFLINE_IN_MEMORY"; assert x["expected_envelopes"] == x["parsed_envelopes"] == 8; assert x["quality_gate_decision"] == "ABSTAIN_NO_MODEL_INFERENCE"; assert x["deployment_gate"] == "HOLD"; assert x["model_action_authority"] == "NONE"; assert x["model_requests"] == 0; assert x["dns_health"] == "NOT_ESTABLISHED"; assert x["root_cause"] == "UNDETERMINED"; assert not x["remediation_authorized"]; assert not x["source_fingerprint_is_provenance_attestation"]'
