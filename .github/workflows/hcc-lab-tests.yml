name: Homelab Control Center lab checks
on:
  pull_request:
    paths:
      - 'experiments/fedora/homelab-control-center-v0.1/**'
      - '.github/workflows/hcc-lab-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  hcc-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript lab model and source isolation tests
        run: |
          cd experiments/fedora/homelab-control-center-v0.1
          node --test tests/*.mjs
      - name: Python aggregate adapter tests — fixtures only
        run: |
          cd experiments/fedora/homelab-control-center-v0.1
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: V0.14.5 offline segment and replay CLI contracts
        run: |
          cd experiments/fedora/homelab-control-center-v0.1
          python3 -B tools/v0145a_segment_spool.py --self-test
          python3 -B tools/v0145a_segment_spool.py --lab
          python3 -B tools/v0145b_segment_replay.py --self-test
          python3 -B tools/v0145b_segment_replay.py --lab
          python3 -B tools/v0145c_checkpoint_store.py --self-test
          python3 -B tools/v0145c_checkpoint_store.py --lab
          python3 -B tools/v0145d_event_identity.py --self-test
          python3 -B tools/v0145d_event_identity.py --lab
      - name: Bash runner syntax check
        run: |
          bash -n experiments/fedora/homelab-control-center-v0.1/run-lab.sh
          bash -n experiments/fedora/homelab-control-center-v0.1/tools/run-live-lab.sh
