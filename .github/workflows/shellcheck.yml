name: Validation suite

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-recovery:
    name: Static, recovery and evidence checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Run static, recovery and evidence-redaction tests
        run: sh tests/test-static.sh
      - name: Run Personal Cloud static policy test
        run: sh tests/test-personal-cloud-static.sh
      - name: Run RouterCloud login UI static test
        run: sh tests/test-routercloud-login-ui-static.sh
      - name: Run Markdown link integrity test
        run: python3 tests/test-doc-links.py
      - name: Run Polish WebUI overlay unit tests
        run: python3 tests/test-asus-webui-pl-overlay.py
      - name: Run Python recovery integration tests
        run: python3 tests/test-recovery.py
      - name: Run Pi-hole DNS collector unit tests
        run: python3 tests/test-pihole-dns-collector.py
      - name: Run firewall mock policy test
        run: sh tests/test-firewall-mock.sh
      - name: Run temporary firewall guard cleanup regression
        run: sh tests/test-firewall-temp-guard-cleanup.sh
      - name: Run firewall configuration rejection test
        run: sh tests/test-config-validation.sh
      - name: Run evidence collector test
        run: sh tests/test-evidence-collector.sh
      - name: Run sanitized DR rebuild-manifest test
        run: sh tests/test-dr-manifest.sh
      - name: Run collector log-retention test
        run: sh tests/test-log-retention.sh
      - name: Run services-start configuration validation
        run: sh tests/test-services-config-validation.sh
      - name: Run services-start crash-safe lock test
        run: sh tests/test-services-lock.sh
      - name: Run services-start Tailscale policy guards
        run: sh tests/test-services-tailscale-policy-static.sh
      - name: Run services-start managed firewall hook guard
        run: sh tests/test-services-firewall-hook-static.sh
      - name: Run healthcheck configuration validation
        run: sh tests/test-healthcheck-config-validation.sh
      - name: Run healthcheck exit-node contract test
        run: sh tests/test-healthcheck-exit-node-contract.sh
      - name: Run healthcheck runtime-drift guard test
        run: sh tests/test-healthcheck-drift-guards.sh
      - name: Run LAN DNS enforcement healthcheck contract test
        run: sh tests/test-healthcheck-lan-dns-contract.sh
      - name: Run LAN DoT blocking healthcheck contract test
        run: sh tests/test-healthcheck-lan-dot-contract.sh
      - name: Run Tailscale update recovery-guard checks
        run: sh tests/test-update-tailscale-static.sh
      - name: Run restore archive validation
        run: sh tests/test-restore-validation.sh
      - name: Run clean-room alternate-root restore
        run: sh tests/test-cleanroom-restore.sh
      - name: Run uninstall cleanup regression
        run: sh tests/test-uninstall.sh
      - name: Run Fedora DR restore finalization dry-run test
        run: sh tests/test-fedora-dr-restore.sh
      - name: Run WAN prevalidation ordering guard
        run: sh tests/test-wan-prevalidation-static.sh

  wan-and-rollback:
    name: WAN handler and install rollback checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run WAN handler mocks
        run: |
          sh tests/test-wan-event-handler.sh
          sh tests/test-wan-config-validation.sh
      - name: Run installer syntax-preflight coverage guard
        run: sh tests/test-install-preflight-static.sh
      - name: Run isolated install and rollback test
        run: sh tests/test-install-rollback.sh

  validation-suite:
    name: Validation suite
    needs:
      - static-and-recovery
      - wan-and-rollback
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all validation jobs to pass
        env:
          STATIC_AND_RECOVERY_RESULT: ${{ needs.static-and-recovery.result }}
          WAN_AND_ROLLBACK_RESULT: ${{ needs.wan-and-rollback.result }}
        run: |
          printf 'static-and-recovery=%s\n' "$STATIC_AND_RECOVERY_RESULT"
          printf 'wan-and-rollback=%s\n' "$WAN_AND_ROLLBACK_RESULT"

          test "$STATIC_AND_RECOVERY_RESULT" = "success"
          test "$WAN_AND_ROLLBACK_RESULT" = "success"
