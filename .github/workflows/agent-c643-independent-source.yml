name: C.64.3 independent source operator HOLD — offline only

on:
  pull_request:
    paths:
      - 'experiments/fedora/local-ai-agent-v0.21/c64/**'
      - '.github/workflows/agent-c643-independent-source.yml'
      - 'experiments/fedora/local-ai-agent-v0.21/c63/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c643-synthetic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Verify pinned C.63 files
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/fedora/local-ai-agent-v0.21/c63
          sha256sum -c SHA256SUMS
          sha256sum -c SHA256SUMS_PUBLIC_C63_11_14.txt
      - name: Run predecessor C.64 regression suites without host access
        shell: bash
        run: |
          set -euo pipefail
          BASE=experiments/fedora/local-ai-agent-v0.21/c64
          python3 -B "$BASE/local_ai_agent_v021c64_0_synthetic_vm_envelope_adapter.py" --self-test
          python3 -B "$BASE/local_ai_agent_v021c64_1_mocked_vm_transport_contract.py" --self-test
          python3 -B "$BASE/local_ai_agent_v021c64_2_listener_identity_preflight.py" --self-test
      - name: Check C.64.3 simulation and immutable HOLD authority
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=experiments/fedora/local-ai-agent-v0.21/c64/local_ai_agent_v021c64_3_independent_source_operator_gate.py
          python3 -B "$SCRIPT" --self-test
          python3 -B "$SCRIPT" --synthetic-matrix
          python3 -B "$SCRIPT" --summary-json --scenario fd_denied | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["schema"]=="local-ai-agent.v0.21.c64.3.independent-source-operator-gate.v1"; assert x["decision"]=="HOLD_FD_ACCESS_DENIED"; assert x["source_identity_cryptographically_attested"] is False; assert x["input_objects_are_authenticated"] is False; assert x["live_http_authorized"] is False; assert x["http_requests"]==x["model_requests"]==0; assert x["quality_gate_decision"]=="ABSTAIN_NO_MODEL_INFERENCE"; assert x["model_action_authority"]=="NONE"; assert x["root_cause"]=="UNDETERMINED"; assert x["dns_health"]=="NOT_ESTABLISHED"; assert x["remediation_authorized"] is False; assert x["deployment_gate"]=="HOLD"'
          python3 -B "$SCRIPT" --summary-json --scenario loopback_match --review-code ACKNOWLEDGE_OFFLINE_FINDINGS | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["decision"]=="HOLD_SOURCE_NOT_ATTESTED"; assert x["review_code_authenticated"] is False; assert x["review_acknowledgement_grants_access"] is False; assert x["live_http_authorized"] is False; assert x["model_requests"]==0'
      - name: Verify C.64.0–C.64.3 cross-stage integration contract
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=experiments/fedora/local-ai-agent-v0.21/c64/local_ai_agent_v021c64_0_3_integration_contract_offline.py
          python3 -B "$SCRIPT" --self-test
          python3 -B "$SCRIPT" --summary-json | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["schema"]=="local-ai-agent.v0.21.c64.0-3.offline-integration-contract.v1"; assert x["scope"]=="FOUR_MODULES_SYNTHETIC_ONLY"; assert x["integration_cases"]==11; assert x["c642_host_inspection_invoked"] is False; assert x["status"]=="OFFLINE_INTEGRATION_CONTRACT_CHECK_ONLY"; assert x["http_requests"]==x["model_requests"]==0; assert x["model_action_authority"]=="NONE"; assert x["live_http_authorized"] is False; assert x["remediation_authorized"] is False; assert x["deployment_gate"]=="HOLD"; assert x["operator_security_approval"]=="NOT_ESTABLISHED"; assert x["merge_authorized"] is False'
