global:
  scrape_interval: 30s
scrape_configs:
  - job_name: asus_wifi_clients
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["127.0.0.1:9101"]
        labels: {device: TUF-AX5400}
  - job_name: blackbox_exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["127.0.0.1:9115"]
  - job_name: internet_https
    scrape_interval: 30s
    scrape_timeout: 8s
    metrics_path: /probe
    params: {module: [http_2xx_ipv4]}
    static_configs:
      - targets: ["https://example.com/"]
        labels: {probe_name: Internet HTTPS}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "127.0.0.1:9115"}
  - job_name: internet_icmp
    scrape_interval: 30s
    scrape_timeout: 5s
    metrics_path: /probe
    params: {module: [icmp_ipv4]}
    static_configs:
      - targets: ["1.1.1.1"]
        labels: {probe_name: Internet ICMP}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "127.0.0.1:9115"}
  - job_name: internet_dns
    scrape_interval: 30s
    scrape_timeout: 5s
    metrics_path: /probe
    params: {module: [dns_router_ipv4]}
    static_configs:
      - targets: ["192.168.50.1"]
        labels: {probe_name: Router DNS}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "127.0.0.1:9115"}
  - job_name: monitoring_http_health
    scrape_interval: 30s
    scrape_timeout: 5s
    metrics_path: /probe
    params: {module: [http_2xx_ipv4]}
    static_configs:
      - targets: ["http://127.0.0.1:8428/-/healthy","http://127.0.0.1:3000/api/health"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "127.0.0.1:9115"}
