  <text x="1275" y="425" class="m small">Szyfrowany tunel WireGuard</text>
  <text x="1275" y="455" class="m small">Zarządzanie bez ekspozycji WAN</text>

  <path d="M748 530V585" class="line"/>
  <polygon points="748,585 739,571 757,571" class="cyan"/>
  <rect x="40" y="585" rx="24" ry="24" width="1120" height="215" class="box" filter="url(#shadow)"/>
  <text x="600" y="633" text-anchor="middle" class="t h head">Sieć lokalna LAN – 192.168.50.0/24</text>
  <text x="600" y="667" text-anchor="middle" class="m body">Jedna sieć lokalna • brak wdrożonych VLAN-ów</text>
