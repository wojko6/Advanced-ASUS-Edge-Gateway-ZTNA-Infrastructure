  <text x="1220" y="650" class="t body">LAN / Tailscale</text>
  <text x="1220" y="686" class="cyan body">↓ dnsmasq + Diversion</text>
  <text x="1220" y="722" class="cyan body">↓ Unbound 127.0.0.1:53535</text>
  <text x="1220" y="758" class="green body">↓ Internet / DNS rekurencyjny</text>

  <rect x="40" y="830" rx="18" ry="18" width="470" height="115" class="pill"/>
  <text x="65" y="870" class="t h body">Wyłączone / nieużywane</text>
  <text x="65" y="907" class="m body">SMB • DLNA • SFTP</text>

  <rect x="535" y="830" rx="18" ry="18" width="505" height="115" class="pill"/>
  <text x="560" y="870" class="t h body">Monitoring / diagnostyka</text>
  <text x="560" y="907" class="m body">uiDivStats • syslog-ng • healthcheck.sh • evidence collector</text>

  <rect x="1065" y="830" rx="18" ry="18" width="495" height="115" class="pill"/>
  <text x="1090" y="870" class="t h body">Nie pokazujemy jako wdrożone</text>
  <text x="1090" y="907" class="m body">VLAN-y • DoT enforcement • przyszłe elementy roadmapy</text>
