<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">ASUS Edge Gateway – aktualna infrastruktura</title>
  <desc id="desc">Aktualny stan wdrożenia ASUS TUF-AX5400 bez VLAN-ów: Tailscale, Unbound, dnsmasq, Diversion, uiDivStats, syslog-ng i projektowy firewall.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07131e"/><stop offset="1" stop-color="#0a2433"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c2230"/><stop offset="1" stop-color="#102f40"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/></filter>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#eef8ff}.m{font-family:Arial,Helvetica,sans-serif;fill:#a8c7d8}.h{font-weight:700}.cyan{fill:#29c7ff}.green{fill:#4ee07a}.orange{fill:#ffb454}.red{fill:#ff6573}.box{fill:url(#panel);stroke:#2bbbea;stroke-width:2}.line{stroke:#35c8ff;stroke-width:4;fill:none}.dash{stroke:#49e07b;stroke-width:4;fill:none;stroke-dasharray:10 8}.soft{stroke:#426476;stroke-width:2;fill:none}.pill{fill:#112f3e;stroke:#2bbbea;stroke-width:1.5}.small{font-size:18px}.body{font-size:21px}.sub{font-size:25px}.head{font-size:34px}.title{font-size:48px}
    </style>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="40" y="66" class="t h title">ASUS EDGE GATEWAY – AKTUALNA INFRASTRUKTURA</text>
  <text x="42" y="106" class="m sub">Stan wdrożony • bez VLAN-ów • wersja projektu v2.1.3 • 9 września 2026</text>

  <rect x="40" y="155" rx="24" ry="24" width="230" height="240" class="box" filter="url(#shadow)"/>
  <text x="155" y="205" text-anchor="middle" class="t h head">Internet</text>
  <circle cx="155" cy="265" r="48" fill="none" stroke="#29c7ff" stroke-width="5"/>
  <path d="M107 265h96M155 217c-18 18-26 30-26 48s8 30 26 48M155 217c18 18 26 30 26 48s-8 30-26 48" class="soft"/>
  <text x="155" y="344" text-anchor="middle" class="m body">ISP / WAN</text>
  <path d="M270 275H335" class="line"/>
  <polygon points="335,275 321,266 321,284" class="cyan"/>

  <rect x="335" y="145" rx="24" ry="24" width="825" height="385" class="box" filter="url(#shadow)"/>
  <text x="375" y="198" class="t h head">ASUS TUF-AX5400</text>
  <text x="375" y="230" class="m body">ASUSWRT-Merlin (gnuton) 3004.388.9_2-gnuton1</text>
  <rect x="375" y="267" rx="12" width="350" height="210" class="pill"/>
  <text x="400" y="305" class="t h body">Aktywne usługi</text>
  <text x="400" y="342" class="t body">• Tailscale 1.102.3</text>
  <text x="400" y="378" class="t body">• Unbound 1.24.2</text>
  <text x="400" y="414" class="t body">• dnsmasq + Diversion</text>
  <text x="400" y="450" class="t body">• uiDivStats 4.0.16</text>

  <rect x="750" y="267" rx="12" width="365" height="210" class="pill"/>
  <text x="775" y="305" class="t h body">Bezpieczeństwo i logi</text>
  <text x="775" y="342" class="t body">• asus-edge / iptables</text>
  <text x="775" y="378" class="t body">• syslog-ng 4.10.2</text>
  <text x="775" y="414" class="t body">• DNS interception TCP/UDP 53</text>
  <text x="775" y="450" class="t body">• Tailscale default-deny policy</text>

