    <rect x="385" y="705" width="120" height="52" rx="8" class="pill"/><text x="445" y="738">Android</text>
    <rect x="535" y="705" width="120" height="52" rx="8" class="pill"/><text x="595" y="738">Drukarka</text>
    <rect x="685" y="705" width="145" height="52" rx="8" class="pill"/><text x="758" y="738">TV / Media</text>
    <rect x="860" y="705" width="120" height="52" rx="8" class="pill"/><text x="920" y="738">IoT</text>
