<!DOCTYPE html>
<html lang="pl-PL">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RouterCloud — logowanie</title>
  <link rel="stylesheet" href="/__routercloud/login.css">
  <script src="/__routercloud/login.js" defer></script>
</head>

<body class="routercloud-login-body">
  <main class="routercloud-login-shell">
    <section class="routercloud-login-card" aria-labelledby="login-title">

      <header class="routercloud-login-brand">
        <div class="routercloud-login-mark" aria-hidden="true">R</div>

        <div>
          <h1 id="login-title">RouterCloud</h1>
          <p>Twój prywatny dysk w sieci domowej</p>
        </div>
      </header>

      <form
        id="routercloud-login-form"
        class="routercloud-login-form"
        method="post"
        action="/__routercloud/login">

        <label class="routercloud-login-field">
          <span class="routercloud-login-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/>
            </svg>
          </span>

          <input
            id="routercloud-username"
            name="username"
            type="text"
            placeholder="Nazwa użytkownika"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required>
        </label>

        <label class="routercloud-login-field">
          <span class="routercloud-login-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M17 8h-1V6a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zm-7-2a2 2 0 1 1 4 0v2h-4V6zm3 10.73V18h-2v-1.27a2 2 0 1 1 2 0z"/>
            </svg>
          </span>

          <input
            id="routercloud-password"
            name="password"
            type="password"
            placeholder="Hasło"
            autocomplete="current-password"
            required>
        </label>

        <div
          id="routercloud-login-error"
          class="routercloud-login-error hidden"
          role="alert">
        </div>

        <button
          class="routercloud-login-submit"
          type="submit">
          Zaloguj
        </button>
      </form>

    </section>
  </main>
</body>

</html>
